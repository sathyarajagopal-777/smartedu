<!DOCTYPE html>
<html>
<head>
<title>Smart Education - Topics</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

.navbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h1 {
  font-size: 24px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
}

.header {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}

.header h2 {
  color: #333;
  margin-bottom: 10px;
}

.header p {
  color: #666;
}

.btn-back {
  display: inline-block;
  padding: 10px 20px;
  background-color: #6c757d;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  margin-bottom: 30px;
  cursor: pointer;
}

.btn-back:hover {
  background-color: #5a6268;
}

.topics-list {
  display: grid;
  gap: 20px;
}

.topic-card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  border-left: 5px solid #667eea;
}

.topic-card:hover {
  transform: translateX(5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.topic-card h3 {
  color: #333;
  margin-bottom: 10px;
}

.topic-card p {
  color: #666;
  font-size: 14px;
  margin-bottom: 15px;
}

.btn {
  display: inline-block;
  padding: 8px 20px;
  background-color: #667eea;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.btn:hover {
  background-color: #764ba2;
}

.topic-number {
  display: inline-block;
  background-color: #667eea;
  color: white;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  text-align: center;
  line-height: 30px;
  margin-right: 10px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="navbar">
  <h1 id="course-name">📚 Course</h1>
  <div>
    <a onclick="goBack()">← Back</a>
  </div>
</div>

<div class="container">
  <button class="btn-back" onclick="goBack()">← Back to Courses</button>
  
  <div class="header">
    <h2>📖 Topics in This Course</h2>
    <p>Click on any topic to start learning!</p>
  </div>
  
  <div class="topics-list" id="topics-container">
  </div>
</div>

<script>
let coursesData = [
  {
    id: 1,
    name: "Java Basics",
    icon: "☕",
    topics_list: [
      {
        id: 1,
        name: "Variables & Data Types",
        content: "Variables are containers for storing data values. In Java, you must declare the type of variable before using it.\n\nMain Data Types:\n1. int - Integer numbers (25, -10)\n2. double - Decimal numbers (3.14, 2.5)\n3. boolean - True or False\n4. String - Text ('Hello', 'John')\n\nExample:\nint age = 25;\nString name = 'John';\ndouble salary = 50000.50;"
      },
      {
        id: 2,
        name: "Operators",
        content: "Operators perform operations on variables.\n\nArithmetic: +, -, *, /, %\nint sum = 10 + 20;  // Result: 30\nint diff = 20 - 10; // Result: 10\n\nComparison: ==, !=, <, >, <=, >=\nif(age > 18) { System.out.println('Adult'); }\n\nLogical: &&, ||, !\nif(age > 18 && country == 'India') { }"
      },
      {
        id: 3,
        name: "Conditional Statements",
        content: "Execute code based on conditions.\n\nIf Statement:\nif (age > 18) {\n  System.out.println('Adult');\n}\n\nIf-Else:\nif (age > 18) {\n  System.out.println('Adult');\n} else {\n  System.out.println('Minor');\n}\n\nIf-Else If-Else:\nif (marks >= 90) {\n  grade = 'A';\n} else if (marks >= 80) {\n  grade = 'B';\n} else {\n  grade = 'C';\n}"
      },
      {
        id: 4,
        name: "Loops",
        content: "Repeat code multiple times.\n\nFor Loop:\nfor(int i = 0; i < 5; i++) {\n  System.out.println(i);\n}\nOutput: 0 1 2 3 4\n\nWhile Loop:\nint i = 0;\nwhile(i < 5) {\n  System.out.println(i);\n  i++;\n}\n\nDo-While:\ndo {\n  System.out.println(i);\n  i++;\n} while(i < 5);"
      },
      {
        id: 5,
        name: "Arrays",
        content: "Store multiple values in one variable.\n\nDeclaration:\nint[] numbers = new int[5];\nint[] numbers = {1, 2, 3, 4, 5};\n\nAccess:\nnumbers[0] = 10;  // Set first element\nint first = numbers[0]; // Get first element\n\nLength:\nnumbers.length;  // Returns 5\n\nLoop Through:\nfor(int i = 0; i < numbers.length; i++) {\n  System.out.println(numbers[i]);\n}"
      },
      {
        id: 6,
        name: "Methods",
        content: "Reusable blocks of code.\n\nMethod Declaration:\npublic static int add(int a, int b) {\n  return a + b;\n}\n\nCalling Method:\nint result = add(5, 3);  // Output: 8\n\nMethod without Return:\npublic static void greet(String name) {\n  System.out.println('Hello, ' + name);\n}\n\ngreet('John');  // Output: Hello, John"
      },
      {
        id: 7,
        name: "Classes & Objects",
        content: "Blueprint for creating objects.\n\nClass:\npublic class Car {\n  String color;\n  String model;\n  \n  void drive() {\n    System.out.println('Car is driving...');\n  }\n}\n\nObject:\nCar myCar = new Car();\nmyCar.color = 'Red';\nmyCar.model = 'BMW';\nmyCar.drive();"
      },
      {
        id: 8,
        name: "String Methods",
        content: "Work with text strings.\n\nCommon Methods:\nlength() - 'Hello'.length() = 5\ntoUpperCase() - 'hello'.toUpperCase() = HELLO\ntoLowerCase() - 'HELLO'.toLowerCase() = hello\ncharAt(0) - 'Hello'.charAt(0) = H\nsubstring(1, 4) - 'Hello'.substring(1, 4) = ell\nindexOf('l') - 'Hello'.indexOf('l') = 2\nreplace('l', 'L') - 'Hello'.replace('l', 'L') = HeLLo"
      }
    ]
  },
  {
    id: 2,
    name: "Python Basics",
    icon: "🐍",
    topics_list: [
      {
        id: 1,
        name: "Syntax & Variables",
        content: "Python has simple syntax.\n\nVariables:\nname = 'John'\nage = 25\nheight = 5.9\nis_student = True\n\nNo type declaration needed.\n\nComments:\n# Single line\n'''\nMulti-line\n'''\n\nPython uses : and indentation\nif age > 18:\n    print('Adult')"
      },
      {
        id: 2,
        name: "Data Types",
        content: "Different types of data:\n\nString: 'Hello'\nInteger: 5, 10, -20\nFloat: 3.14, 2.5\nBoolean: True, False\nList: [1, 2, 3] - Can change\nTuple: (1, 2, 3) - Cannot change\nDictionary: {'name': 'John'}\n\nList Methods:\nappend(), remove(), sort()\n\nDictionary:\nperson = {'name': 'John'}\nperson['name']  # John"
      },
      {
        id: 3,
        name: "Conditional Statements",
        content: "Make decisions.\n\nif age > 18:\n    print('Adult')\n\nif-else:\nif age > 18:\n    print('Adult')\nelse:\n    print('Minor')\n\nif-elif-else:\nif marks >= 90:\n    grade = 'A'\nelif marks >= 80:\n    grade = 'B'\nelse:\n    grade = 'C'"
      },
      {
        id: 4,
        name: "Loops",
        content: "Repeat code.\n\nFor Loop:\nfor i in range(5):\n    print(i)  # 0 1 2 3 4\n\nWhile Loop:\ni = 0\nwhile i < 5:\n    print(i)\n    i += 1\n\nBreak & Continue:\nif i == 5:\n    break  # Exit\nif i == 2:\n    continue  # Skip"
      },
      {
        id: 5,
        name: "Lists & Tuples",
        content: "Store values.\n\nLists (Can change):\nfruits = ['apple', 'banana']\nfruits[0] = 'mango'  # Change\nfruits.append('grape')  # Add\nlen(fruits)  # Length\n\nTuples (Cannot change):\ncoords = (10, 20)\ncoords[0]  # 10\n\nMethods:\nsort(), reverse(), copy()"
      },
      {
        id: 6,
        name: "Dictionaries",
        content: "Key-value pairs.\n\nperson = {\n    'name': 'John',\n    'age': 25\n}\n\nAccess:\nperson['name']  # John\nperson.get('age')  # 25\n\nAdd/Update:\nperson['city'] = 'NYC'\nperson['age'] = 26\n\nMethods:\nkeys(), values(), items()"
      },
      {
        id: 7,
        name: "Functions",
        content: "Reusable code.\n\ndef greet():\n    print('Hello')\ngreet()\n\nWith Parameters:\ndef add(a, b):\n    return a + b\nadd(5, 3)  # 8\n\nDefault Parameters:\ndef greet(name='Guest'):\n    print(f'Hello, {name}!')\n\nMultiple Returns:\nreturn 'John', 25"
      }
    ]
  },
  {
    id: 3,
    name: "Data Structures",
    icon: "🔗",
    topics_list: [
      {
        id: 1,
        name: "Arrays & Lists",
        content: "Collections.\n\nArray: Fixed size\nAccess: O(1)\nInsert: O(n)\nDelete: O(n)\n\nList: Dynamic size\nInsert/Delete easier\n\nAdvantage: Fast access\nDisadvantage: Fixed size"
      },
      {
        id: 2,
        name: "Stacks",
        content: "LIFO - Last In First Out\n\nPush - Add\nPop - Remove\nPeek - View top\n\nAll O(1)\n\nUses:\nUndo/Redo\nBrowser history\nFunction calls"
      },
      {
        id: 3,
        name: "Queues",
        content: "FIFO - First In First Out\n\nEnqueue - Add\nDequeue - Remove\nPeek - View front\n\nAll O(1)\n\nUses:\nPrinter queue\nCPU scheduling"
      },
      {
        id: 4,
        name: "Linked Lists",
        content: "Dynamic structure\n\nNode: data + next\nInsert/Delete: O(1)\nAccess: O(n)\n\nAdvantage: Dynamic\nDisadvantage: Slow access"
      },
      {
        id: 5,
        name: "Trees",
        content: "Hierarchical\n\nRoot - Top\nLeaves - Bottom\n\nTraversal:\nInorder, Preorder, Postorder\n\nUses:\nFile systems\nDatabase indexing"
      },
      {
        id: 6,
        name: "Graphs",
        content: "Vertices & edges\n\nDirected/Undirected\nWeighted/Unweighted\n\nTraversal:\nBFS, DFS\n\nUses:\nMaps, Networks\nRecommendations"
      }
    ]
  },
  {
    id: 4,
    name: "Web Development",
    icon: "🌐",
    topics_list: [
      {
        id: 1,
        name: "HTML Basics",
        content: "Page structure.\n\nTags:\n<html>, <head>, <body>\n<div>, <p>, <h1>\n<a>, <img>, <button>\n\nAttributes:\nsrc, href, alt, class, id\n\nSemantics:\n<header>, <nav>, <main>\n<footer>"
      },
      {
        id: 2,
        name: "CSS Styling",
        content: "Make beautiful.\n\nSelectors:\n.class, #id, element\n\nProperties:\ncolor, background, size\nmargin, padding, border\n\nLayouts:\nFlexbox, Grid"
      },
      {
        id: 3,
        name: "JavaScript Basics",
        content: "Interactive pages.\n\nVariables:\nlet, const, var\n\nFunctions:\nfunction name() { }\n\nDOM:\ndocument.getElementById()\nelement.textContent"
      },
      {
        id: 4,
        name: "Forms & Validation",
        content: "Get user input.\n\nElements:\n<input>, <textarea>\n<select>, <button>\n\nValidation:\nrequired, type\nJavaScript checks"
      },
      {
        id: 5,
        name: "Responsive Design",
        content: "All devices.\n\nMedia Queries:\n@media (max-width: 600px)\n\nViewport Meta Tag\n\nMobile-First approach"
      }
    ]
  },
  {
    id: 5,
    name: "Database Basics",
    icon: "🗄️",
    topics_list: [
      {
        id: 1,
        name: "SQL Basics",
        content: "Query language.\n\nCRUD:\nCREATE, READ, UPDATE\nDELETE\n\nBasic Queries:\nSELECT, INSERT, UPDATE\nDELETE"
      },
      {
        id: 2,
        name: "Queries & Joins",
        content: "Complex retrieval.\n\nJoins:\nINNER, LEFT, RIGHT\n\nAggregate:\nCOUNT, SUM, AVG\nMAX, MIN"
      },
      {
        id: 3,
        name: "Database Design",
        content: "Organize data.\n\nER Diagram\nNormalization\nKeys, Indexes"
      },
      {
        id: 4,
        name: "Relationships",
        content: "Connect tables.\n\nOne-to-One\nOne-to-Many\nMany-to-Many"
      },
      {
        id: 5,
        name: "Transactions & Security",
        content: "Safe operations.\n\nTransactions:\nBEGIN, COMMIT\nROLLBACK\n\nSecurity: Validation"
      }
    ]
  }
];

function loadTopics() {
  let currentUser = localStorage.getItem("currentUser");
  
  if(!currentUser) {
    window.location.href = "login.html";
  }
  
  let selectedCourseId = localStorage.getItem("selectedCourse");
  
  if(!selectedCourseId) {
    window.location.href = "courses.html";
  }
  
  let course = coursesData.find(c => c.id == selectedCourseId);
  
  document.getElementById("course-name").textContent = course.icon + " " + course.name;
  
  let container = document.getElementById("topics-container");
  container.innerHTML = "";
  
  course.topics_list.forEach((topic, index) => {
    let card = document.createElement("div");
    card.className = "topic-card";
    card.onclick = () => selectTopic(selectedCourseId, topic.id, topic.name);
    
    card.innerHTML = `
      <div style="display: flex; align-items: center;">
        <span class="topic-number">${index + 1}</span>
        <div style="flex: 1;">
          <h3>${topic.name}</h3>
          <p>${topic.content.substring(0, 100)}...</p>
        </div>
      </div>
      <button class="btn">Learn →</button>
    `;
    
    container.appendChild(card);
  });
}

function selectTopic(courseId, topicId, topicName) {
  localStorage.setItem("selectedTopic", topicId);
  localStorage.setItem("selectedTopicName", topicName);
  
  window.location.href = "learn.html";
}

function goBack() {
  window.location.href = "courses.html";
}

window.onload = loadTopics;
</script>

</body>
</html>
