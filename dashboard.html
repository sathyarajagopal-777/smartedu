<!DOCTYPE html>
<html>
<head>
<title>Smart Education - Dashboard</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

.navbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h1 {
  font-size: 24px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  cursor: pointer;
  font-weight: bold;
}

.navbar a:hover {
  text-decoration: underline;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
}

.welcome-box {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}

.welcome-box h2 {
  color: #333;
  margin-bottom: 10px;
}

.welcome-box p {
  color: #666;
  font-size: 16px;
}

.modules-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.module-card {
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: center;
  cursor: pointer;
  transition: transform 0.3s;
}

.module-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.module-card .icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.module-card h3 {
  color: #333;
  margin-bottom: 10px;
}

.module-card p {
  color: #666;
  font-size: 14px;
}

.btn-link {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 20px;
  background-color: #667eea;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
}

.btn-link:hover {
  background-color: #764ba2;
}
</style>
</head>
<body>

<div class="navbar">
  <h1>🎓 Smart Education</h1>
  <div>
    Welcome, <strong id="user-name">Student</strong>
    <a onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
  <div class="welcome-box">
    <h2>Welcome to Dashboard! 👋</h2>
    <p id="welcome-text">Start learning today!</p>
  </div>
  
  <div class="modules-grid">
    <div class="module-card">
      <div class="icon">📚</div>
      <h3>Learn</h3>
      <p>Course materials</p>
      <a href="#" class="btn-link">Coming Soon</a>
    </div>
    
    <div class="module-card">
      <div class="icon">✏️</div>
      <h3>Practice</h3>
      <p>Practice problems</p>
      <a href="#" class="btn-link">Coming Soon</a>
    </div>
    
    <div class="module-card">
      <div class="icon">📝</div>
      <h3>Quiz</h3>
      <p>Test your knowledge</p>
      <a href="#" class="btn-link">Coming Soon</a>
    </div>
    
    <div class="module-card">
      <div class="icon">📊</div>
      <h3>Progress</h3>
      <p>Track progress</p>
      <a href="#" class="btn-link">Coming Soon</a>
    </div>
    
    <div class="module-card">
      <div class="icon">👤</div>
      <h3>Profile</h3>
      <p>View profile</p>
      <a href="profile.html" class="btn-link">Go to Profile</a>
    </div>
  </div>
</div>

<script>
let currentUser = localStorage.getItem("currentUser");

if(!currentUser) {
  window.location.href = "login.html";
} else {
  document.getElementById("user-name").textContent = currentUser;
  document.getElementById("welcome-text").textContent = "Welcome back, " + currentUser + "!";
}

function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>

</body>
</html>
