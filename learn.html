<!DOCTYPE html>
<html>
<head>
<title>Smart Education - Courses</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

.navbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h1 {
  font-size: 24px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  cursor: pointer;
  font-weight: bold;
}

.navbar a:hover {
  text-decoration: underline;
}

.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;
}

.header {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}

.header h2 {
  color: #333;
  margin-bottom: 10px;
}

.header p {
  color: #666;
}

.courses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.course-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
  cursor: pointer;
}

.course-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.course-header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  text-align: center;
}

.course-header .icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.course-header h3 {
  font-size: 20px;
  margin-bottom: 5px;
}

.course-body {
  padding: 20px;
}

.course-body p {
  color: #666;
  margin-bottom: 15px;
  font-size: 14px;
}

.course-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  padding: 10px;
  background-color: #f5f5f5;
  border-radius: 5px;
}

.course-info span {
  font-size: 13px;
  color: #555;
}

.btn {
  width: 100%;
  padding: 10px;
  background-color: #667eea;
  color: white;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.btn:hover {
  background-color: #764ba2;
}

.btn-back {
  display: inline-block;
  padding: 10px 20px;
  background-color: #6c757d;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  margin-bottom: 30px;
}

.btn-back:hover {
  background-color: #5a6268;
}
</style>
</head>
<body>

<div class="navbar">
  <h1>📚 Courses</h1>
  <div>
    <span id="user-name">Student</span>
    <a onclick="goBack()">← Back</a>
  </div>
</div>

<div class="container">
  <a href="dashboard.html" class="btn-back">← Back to Dashboard</a>
  
  <div class="header">
    <h2>📖 Explore Our Courses</h2>
    <p>Choose a course and start learning with topics, practice, and quizzes!</p>
  </div>
  
  <div class="courses-grid" id="courses-container">
  </div>
</div>

function loadCourses() {
  let currentUser = localStorage.getItem("currentUser");
  
  if(!currentUser) {
    window.location.href = "login.html";
  }
  
  document.getElementById("user-name").textContent = currentUser;
  
  let container = document.getElementById("courses-container");
  container.innerHTML = "";
  
  coursesData.forEach(course => {
    let card = document.createElement("div");
    card.className = "course-card";
    card.onclick = () => selectCourse(course.id);
    
    card.innerHTML = `
      <div class="course-header">
        <div class="icon">${course.icon}</div>
        <h3>${course.name}</h3>
      </div>
      <div class="course-body">
        <p>${course.description}</p>
        <div class="course-info">
          <span>📚 ${course.topics} Topics</span>
          <span>⭐ ${course.difficulty}</span>
        </div>
        <button class="btn">Explore Course</button>
      </div>
    `;
    
    container.appendChild(card);
  });
}

function selectCourse(courseId) {
  localStorage.setItem("selectedCourse", courseId);
  window.location.href = "course-detail.html";
}

function goBack() {
  window.location.href = "dashboard.html";
}

window.onload = loadCourses;
