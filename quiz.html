<!DOCTYPE html>
<html>
<head>
<title>Smart Education - Quiz</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}

.navbar {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h1 {
  font-size: 24px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 20px;
}

.header {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}

.header h2 {
  color: #333;
  margin-bottom: 10px;
}

.header p {
  color: #666;
}

.btn-back {
  display: inline-block;
  padding: 10px 20px;
  background-color: #6c757d;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  margin-bottom: 30px;
  cursor: pointer;
}

.btn-back:hover {
  background-color: #5a6268;
}

.quizzes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

.quiz-card {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.3s;
  border-top: 5px solid #667eea;
  text-align: center;
}

.quiz-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.quiz-icon {
  font-size: 60px;
  margin-bottom: 15px;
}

.quiz-card h3 {
  color: #333;
  margin-bottom: 10px;
  font-size: 24px;
}

.quiz-card p {
  color: #666;
  margin-bottom: 15px;
  font-size: 14px;
}

.quiz-info {
  display: flex;
  justify-content: space-around;
  margin-bottom: 20px;
  padding: 15px;
  background-color: #f5f5f5;
  border-radius: 5px;
}

.quiz-info span {
  color: #667eea;
  font-weight: bold;
}

.btn {
  display: inline-block;
  padding: 12px 30px;
  background-color: #667eea;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.btn:hover {
  background-color: #764ba2;
}
</style>
</head>
<body>

<div class="navbar">
  <h1>📝 Quiz</h1>
  <div>
    <a onclick="goBack()">← Back</a>
  </div>
</div>

<div class="container">
  <button class="btn-back" onclick="goBack()">← Back to Dashboard</button>
  
  <div class="header">
    <h2>📋 Available Quizzes</h2>
    <p>Test your knowledge and improve your skills!</p>
  </div>
  
  <div class="quizzes-grid" id="quizzes-container">
  </div>
</div>

<script>
let quizzesData = [
  {
    id: 1,
    title: "Java Basics Quiz",
    icon: "☕",
    description: "Test your knowledge of Java programming basics",
    questions: 10,
    difficulty: "Beginner",
    passingScore: 70,
    questions_list: [
      {
        id: 1,
        question: "What is the correct syntax to declare an integer variable in Java?",
        options: ["int x = 5;", "integer x = 5;", "Int x = 5;", "INT x = 5;"],
        answer: 0
      },
      {
        id: 2,
        question: "Which data type can store decimal numbers in Java?",
        options: ["int", "double", "boolean", "String"],
        answer: 1
      },
      {
        id: 3,
        question: "What is the default value of a boolean variable in Java?",
        options: ["true", "false", "null", "0"],
        answer: 1
      },
      {
        id: 4,
        question: "How many bits does an 'int' data type use?",
        options: ["8 bits", "16 bits", "32 bits", "64 bits"],
        answer: 2
      },
      {
        id: 5,
        question: "Which of the following is a valid variable name in Java?",
        options: ["2variable", "variable-name", "variable_name", "variable name"],
        answer: 2
      },
      {
        id: 6,
        question: "What is the result of 10 + 5 * 2 in Java?",
        options: ["30", "20", "25", "15"],
        answer: 1
      },
      {
        id: 7,
        question: "What does the % operator do?",
        options: ["Multiply", "Divide", "Modulus (remainder)", "Percentage"],
        answer: 2
      },
      {
        id: 8,
        question: "What is the result of 5 == 5?",
        options: ["5", "true", "false", "Error"],
        answer: 1
      },
      {
        id: 9,
        question: "What is the result of true && false?",
        options: ["true", "false", "null", "Error"],
        answer: 1
      },
      {
        id: 10,
        question: "What does the != operator check?",
        options: ["Not equal to", "Not", "Not greater than", "Not less than"],
        answer: 0
      }
    ]
  }
];

function loadQuizzes() {
  let currentUser = localStorage.getItem("currentUser");
  
  if(!currentUser) {
    window.location.href = "login.html";
  }
  
  let container = document.getElementById("quizzes-container");
  container.innerHTML = "";
  
  quizzesData.forEach(quiz => {
    let card = document.createElement("div");
    card.className = "quiz-card";
    card.onclick = () => selectQuiz(quiz.id);
    
    card.innerHTML = `
      <div class="quiz-icon">${quiz.icon}</div>
      <h3>${quiz.title}</h3>
      <p>${quiz.description}</p>
      <div class="quiz-info">
        <span>📝 ${quiz.questions} Questions</span>
        <span>⭐ ${quiz.difficulty}</span>
      </div>
      <div class="quiz-info">
        <span>🎯 Pass: ${quiz.passingScore}%</span>
      </div>
      <button class="btn">Start Quiz</button>
    `;
    
    container.appendChild(card);
  });
}

function selectQuiz(quizId) {
  localStorage.setItem("selectedQuiz", quizId);
  window.location.href = "quiz-questions.html";
}

function goBack() {
  window.location.href = "dashboard.html";
}

window.onload = loadQuizzes;
</script>

</body>
</html>
