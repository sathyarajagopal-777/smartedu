<!DOCTYPE html>
<html>
<head>
<title>Smart Education - Register</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  background: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  width: 350px;
}

.container h1 {
  text-align: center;
  color: #333;
  margin-bottom: 20px;
  font-size: 28px;
}

.info {
  background-color: #e7f3ff;
  border-left: 4px solid #667eea;
  padding: 10px;
  margin-bottom: 20px;
  border-radius: 5px;
  color: #333;
  font-size: 13px;
  text-align: center;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #555;
  font-weight: bold;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 5px;
  font-size: 14px;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
}

.btn {
  width: 100%;
  padding: 12px;
  background-color: #667eea;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn:hover {
  background-color: #764ba2;
}

.link-text {
  text-align: center;
  margin-top: 20px;
  color: #666;
}

.link-text a {
  color: #667eea;
  text-decoration: none;
  font-weight: bold;
}

.success {
  color: green;
  text-align: center;
  margin-bottom: 20px;
  display: none;
  font-weight: bold;
}

.error {
  color: red;
  text-align: center;
  margin-bottom: 20px;
  display: none;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="container">
  <h1>📝 Register</h1>
  
  <div class="info">
    📱 Register using Mobile Number
  </div>
  
  <div id="success-msg" class="success"></div>
  <div id="error-msg" class="error"></div>
  
  <div class="form-group">
    <label>Full Name</label>
    <input type="text" id="fullname" placeholder="Your full name">
  </div>
  
  <div class="form-group">
    <label>📱 Mobile Number</label>
    <input type="text" id="mobile" placeholder="10 digits (e.g., 9876543210)">
  </div>
  
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose username">
  </div>
  
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters">
  </div>
  
  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Re-enter password">
  </div>
  
  <button class="btn" onclick="register()">Register Now</button>
  
  <div class="link-text">
    Have account? <a href="login.html">Login here</a>
  </div>
</div>

<script>
function register() {
  let fullname = document.getElementById("fullname").value.trim();
  let mobile = document.getElementById("mobile").value.trim();
  let username = document.getElementById("username").value.trim();
  let password = document.getElementById("password").value;
  let confirmPassword = document.getElementById("confirm-password").value;
  
  let successMsg = document.getElementById("success-msg");
  let errorMsg = document.getElementById("error-msg");
  
  successMsg.style.display = "none";
  errorMsg.style.display = "none";
  
  // CHECK 1: All fields filled
  if(fullname === "" || mobile === "" || username === "" || password === "" || confirmPassword === "") {
    errorMsg.textContent = "❌ Fill all fields!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 2: Mobile exactly 10 digits
  if(mobile.length !== 10) {
    errorMsg.textContent = "❌ Mobile must be 10 digits!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 3: Mobile only numbers
  if(isNaN(mobile)) {
    errorMsg.textContent = "❌ Mobile must be numbers only!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 4: Mobile starts with 6-9
  if(mobile.charAt(0) < '6') {
    errorMsg.textContent = "❌ Mobile must start with 6, 7, 8, or 9!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 5: Passwords match
  if(password !== confirmPassword) {
    errorMsg.textContent = "❌ Passwords don't match!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 6: Password length
  if(password.length < 6) {
    errorMsg.textContent = "❌ Password min 6 characters!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 7: Username length
  if(username.length < 3) {
    errorMsg.textContent = "❌ Username min 3 characters!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 8: Username not taken
  let existingUsers = {
    "rahul": "123456",
    "priya": "password123",
    "amit": "amit@123",
    "john": "john@456"
  };
  
  if(existingUsers[username]) {
    errorMsg.textContent = "❌ Username already taken!";
    errorMsg.style.display = "block";
    return;
  }
  
  // CHECK 9: Mobile not already registered
  for(let key in localStorage) {
    try {
      let userData = JSON.parse(localStorage.getItem(key));
      if(userData && userData.mobile === mobile) {
        errorMsg.textContent = "❌ Mobile already registered!";
        errorMsg.style.display = "block";
        return;
      }
    } catch(e) {}
  }
  
  // ALL CHECKS PASSED - SAVE USER
  
  let newUser = {
    fullname: fullname,
    mobile: mobile,
    username: username,
    password: password,
    registrationDate: new Date().toLocaleDateString()
  };
  
  localStorage.setItem(username, JSON.stringify(newUser));
  
  successMsg.textContent = "✅ Registration Success! Going to login...";
  successMsg.style.display = "block";
  
  // Clear form
  document.getElementById("fullname").value = "";
  document.getElementById("mobile").value = "";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("confirm-password").value = "";
  
  setTimeout(function() {
    window.location.href = "login.html";
  }, 2000);
}

document.addEventListener("keypress", function(event) {
  if(event.key === "Enter") {
    register();
  }
});
</script>

</body>
</html>
